<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kintaro Formulary</title>
<style>
  :root {
    color-scheme: dark;
    --bg:#0F1116;
    --bg2:#181B22;
    --fg:#ECE6D8;
    --muted:#898577;
    --accent:#C9A35E;
    --accent-deep:#8E7038;
    --secondary:#5A2A2A;
    --line:rgba(236,230,216,.14);
    --line2:rgba(236,230,216,.28);
    --chip:rgba(236,230,216,.06);
    --head:rgba(24,27,34,.96);
    --shadow:0 24px 80px rgba(0,0,0,.32);
    --sans:"Inter Tight",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --display:Fraunces,"Cormorant Garamond",Georgia,serif;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin:0;
    min-height:100vh;
    font:14px/1.5 var(--sans);
    background:
      radial-gradient(circle at 10% -10%, rgba(201,163,94,.18), transparent 32rem),
      radial-gradient(circle at 88% 4%, rgba(90,42,42,.42), transparent 34rem),
      var(--bg);
    color:var(--fg);
  }
  header {
    padding:28px 24px 30px;
    border-bottom:1px solid var(--line2);
    background:
      linear-gradient(135deg, rgba(236,230,216,.06), transparent 42%),
      linear-gradient(180deg, rgba(15,17,22,.72), rgba(15,17,22,.96));
  }
  .brandbar {
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:18px;
    max-width:1440px;
    margin:0 auto 28px;
  }
  .wordmark {
    color:var(--fg);
    font-family:var(--display);
    font-size:18px;
    letter-spacing:.16em;
    line-height:1;
    text-transform:uppercase;
  }
  .wordmark span { color:var(--accent); font-style:italic; letter-spacing:.04em; margin:0 8px; }
  .kicker {
    color:var(--muted);
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.22em;
    text-transform:uppercase;
  }
  .hero { max-width:1440px; margin:0 auto; }
  h1 {
    margin:0;
    max-width:820px;
    font-family:var(--display);
    font-size:clamp(46px, 8vw, 96px);
    font-weight:400;
    letter-spacing:-.045em;
    line-height:.92;
  }
  h1 em { color:var(--accent); font-style:italic; }
  .meta { color:var(--muted); margin-top:18px; max-width:620px; font-size:16px; }
  .meta strong { color:var(--fg); font-weight:500; }
  .tabs { display:flex; gap:8px; flex-wrap:wrap; padding:18px 24px 0; max-width:1488px; margin:0 auto; }
  .tab {
    padding:8px 14px;
    border:1px solid var(--line);
    border-radius:999px;
    cursor:pointer;
    background:var(--chip);
    color:var(--fg);
    font-size:13px;
    transition:background .2s, border-color .2s, color .2s, transform .2s;
  }
  .tab:hover { border-color:var(--line2); transform:translateY(-1px); }
  .tab.active { background:var(--fg); color:var(--bg); border-color:var(--fg); }
  .tab .n { opacity:.68; margin-left:6px; font-variant-numeric:tabular-nums; }
  .controls {
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    align-items:center;
    padding:14px 24px;
    position:sticky;
    top:0;
    background:rgba(15,17,22,.88);
    border-bottom:1px solid var(--line);
    backdrop-filter:blur(16px);
    z-index:5;
  }
  .controls-inner { display:flex; gap:12px; flex-wrap:wrap; align-items:center; width:100%; max-width:1440px; margin:0 auto; }
  input, select {
    font:inherit;
    padding:10px 14px;
    border:1px solid var(--line);
    border-radius:999px;
    outline:none;
    background:var(--bg2);
    color:var(--fg);
  }
  input:focus, select:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(201,163,94,.14); }
  input[type=search]{ min-width:260px; flex:1; }
  label.mono { display:flex; align-items:center; gap:8px; color:var(--muted); }
  input[type=checkbox] { accent-color:var(--accent); }
  .wrap { max-width:1488px; margin:0 auto; padding:18px 24px 64px; overflow-x:auto; }
  table {
    border-collapse:separate;
    border-spacing:0;
    width:100%;
    min-width:760px;
    overflow:hidden;
    border:1px solid var(--line);
    border-radius:18px;
    background:rgba(24,27,34,.72);
    box-shadow:var(--shadow);
  }
  th, td { text-align:left; padding:11px 14px; border-bottom:1px solid var(--line); vertical-align:top; }
  tbody tr:last-child td { border-bottom:0; }
  tbody tr:hover td { background:rgba(236,230,216,.035); }
  th {
    position:sticky;
    top:65px;
    z-index:4;
    background:var(--head);
    color:var(--muted);
    cursor:pointer;
    font-family:var(--mono);
    font-size:11px;
    font-weight:500;
    letter-spacing:.16em;
    text-transform:uppercase;
  }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  .mono { font-family:var(--mono); font-size:12px; }
  .tag {
    display:inline-block;
    background:rgba(201,163,94,.12);
    border:1px solid rgba(201,163,94,.22);
    border-radius:999px;
    padding:2px 8px;
    margin:1px 3px 1px 0;
    color:var(--accent);
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:.04em;
  }
  .tag.review { background:rgba(90,42,42,.5); border-color:rgba(201,163,94,.38); color:#F0D69B; }
  .cat { color:var(--accent); font-weight:500; }
  .empty { color:var(--muted); padding:48px 0; text-align:center; }
  .cell-act { width:36px; text-align:center; padding:8px 6px; }
  .btn-dismiss {
    opacity:0;
    background:none;
    border:none;
    color:var(--muted);
    cursor:pointer;
    font-size:18px;
    line-height:1;
    padding:0 4px;
    border-radius:4px;
    transition:opacity .12s, color .12s;
  }
  tbody tr:hover .btn-dismiss { opacity:1; }
  .btn-dismiss:hover { color:#e57373; }
  .btn-restore {
    background:none;
    border:1px solid var(--line);
    color:var(--muted);
    cursor:pointer;
    font-size:11px;
    padding:3px 6px;
    border-radius:4px;
    font-family:var(--mono);
  }
  .btn-restore:hover { color:var(--fg); border-color:rgba(201,163,94,.5); }
  .row-hidden td { opacity:.28; }
  .row-hidden .cell-act { opacity:1 !important; }
  #hidden-bar {
    display:flex;
    align-items:center;
    gap:10px;
    font-size:12px;
    font-family:var(--mono);
    color:var(--muted);
    margin-left:auto;
    white-space:nowrap;
  }
  #hidden-bar button {
    background:none;
    border:1px solid var(--line);
    color:var(--muted);
    cursor:pointer;
    padding:5px 12px;
    border-radius:999px;
    font-size:11px;
    font-family:var(--mono);
    letter-spacing:.04em;
    transition:color .12s, border-color .12s;
  }
  #hidden-bar button:hover { color:var(--fg); border-color:rgba(201,163,94,.5); }
  @media (max-width:720px) {
    header { padding:22px 18px 26px; }
    .brandbar { align-items:flex-start; flex-direction:column; margin-bottom:22px; }
    .tabs, .controls, .wrap { padding-left:18px; padding-right:18px; }
    input[type=search] { min-width:100%; }
    th { top:118px; }
  }
</style>
</head>

</div>
<div class="wrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>

ed":"no","tags":"","notes":""}];
const CATS = ["All","Sexual Wellness","Hair Restoration","Peptide Therapy","Weight Management","Hormone Therapy","Dermatology","Wellness / Longevity","Supplies & Fees"];
const PHARMS = ["All","V Pharm","Peptides Supplier","S Pharm"];
const COLS = [
  ["category","Category"],["product_name","Product"],["strength","Strength"],["form","Form"],["package","Package"],
  ["pharmacy","Pharmacy"],["sku","SKU"],["wholesale_cost","Wholesale $"],["tags","Tags"],["notes","Notes"]
];
let activeCat = "All", sortKey = null, sortDir = 1;
let hidden = new Set(JSON.parse(localStorage.getItem('k_hidden') || '[]'));
let showHidden = false;

const el = (id)=>document.getElementById(id);
function rowKey(r){ return [r.product_name,r.strength,r.pharmacy,r.sku].join('|'); }
function saveHidden(){ localStorage.setItem('k_hidden', JSON.stringify([...hidden])); }
function renderHiddenBar(){
  const bar = el('hidden-bar');
  if(hidden.size === 0){ bar.hidden = true; showHidden = false; return; }
  bar.hidden = false;
  bar.innerHTML = '<span>'+hidden.size+' hidden</span>'
    +'<button id="btn-toggle-hidden">'+(showHidden?'Hide dismissed':'Show dismissed')+'</button>'
    +'<button id="btn-clear-hidden">Restore all</button>';
  el('btn-toggle-hidden').onclick = ()=>{ showHidden=!showHidden; renderHiddenBar(); render(); };
  el('btn-clear-hidden').onclick  = ()=>{ hidden.clear(); saveHidden(); showHidden=false; renderHiddenBar(); render(); };
}
function counts(cat){ return cat==="All"?ROWS.length:ROWS.filter(r=>r.category===cat).length; }

function renderTabs(){
  el("tabs").innerHTML = CATS.map(c =>
    '<span class="tab'+(c===activeCat?' active':'')+'" data-c="'+c+'">'+c+'<span class="n">'+counts(c)+'</span></span>'
  ).join("");
  el("tabs").querySelectorAll(".tab").forEach(t=>t.onclick=()=>{ activeCat=t.dataset.c; renderTabs(); render(); el("tabs").scrollIntoView({behavior:"smooth",block:"start"}); });
}
function renderHead(){
  el("thead").innerHTML = "<tr>"+COLS.map(([k,l])=>
    '<th class="'+(k==="wholesale_cost"?"num":"")+'" data-k="'+k+'">'+l+(sortKey===k?(sortDir>0?" ▲":" ▼"):"")+"</th>"
  ).join("")+"<th class=\"cell-act\"></th></tr>";
  el("thead").querySelectorAll("th[data-k]").forEach(th=>th.onclick=()=>{
    const k=th.dataset.k; if(sortKey===k) sortDir*=-1; else {sortKey=k; sortDir=1;} render();
  });
}
function tagHtml(tags){ return tags? tags.split("|").filter(Boolean).map(t=>
  '<span class="tag'+(t==="review"?" review":"")+'">'+t+'</span>').join("") : ""; }

function render(){
  const q = el("q").value.trim().toLowerCase();
  const ph = el("pharm").value;
  const rxOnly = el("rx").checked;
  let rows = ROWS.filter(r=>{
    const k = rowKey(r);
    if(!showHidden && hidden.has(k)) return false;
    if(activeCat!=="All" && r.category!==activeCat) return false;
    if(ph!=="All" && r.pharmacy!==ph) return false;
    if(rxOnly && r.rx_required!=="yes") return false;
    if(q){
      const hay=(r.product_name+" "+r.active_ingredients+" "+r.sku+" "+r.strength+" "+r.tags+" "+r.notes).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  if(sortKey){
    rows = rows.slice().sort((a,b)=>{
      let x=a[sortKey], y=b[sortKey];
      if(sortKey==="wholesale_cost"){ x=parseFloat(x)||0; y=parseFloat(y)||0; return (x-y)*sortDir; }
      return String(x).localeCompare(String(y))*sortDir;
    });
  }
  const visCount = rows.filter(r=>!hidden.has(rowKey(r))).length;
  el("count").textContent = visCount + " of " + ROWS.length + " products";
  el("empty").hidden = rows.length>0;
  el("tbody").innerHTML = rows.map(r=>{
    const k = rowKey(r);
    const isHidden = hidden.has(k);
    const safeKey = k.replace(/"/g,'&quot;');
    const actionCell = isHidden
      ? '<td class="cell-act"><button class="btn-restore" data-key="'+safeKey+'" title="Restore product">↩</button></td>'
      : '<td class="cell-act"><button class="btn-dismiss" data-key="'+safeKey+'" title="Hide this product">×</button></td>';
    return '<tr'+(isHidden?' class="row-hidden"':'')+'>'+COLS.map(([k])=>{
      if(k==="tags") return "<td>"+tagHtml(r.tags)+"</td>";
      if(k==="wholesale_cost") return '<td class="num mono">'+(r[k]?"$"+r[k]:"")+"</td>";
      if(k==="category") return '<td><span class="cat">'+r[k]+'</span></td>';
      if(k==="product_name") return '<td>'+r[k]+"</td>";
      if(k==="sku"||k==="strength"||k==="form") return '<td class="mono">'+r[k]+"</td>";
      return "<td>"+(r[k]||"")+"</td>";
    }).join('')+actionCell+'</tr>';
  }).join("");
}

el("pharm").innerHTML = PHARMS.map(p=>'<option>'+p+'</option>').join("");
el("q").oninput = render; el("pharm").onchange = render; el("rx").onchange = render;
el("tbody").addEventListener("click", e=>{
  const d = e.target.closest(".btn-dismiss");
  const r = e.target.closest(".btn-restore");
  if(d){ hidden.add(d.dataset.key); saveHidden(); renderHiddenBar(); render(); }
  if(r){ hidden.delete(r.dataset.key); saveHidden(); renderHiddenBar(); render(); }
});
renderTabs(); renderHead(); renderHiddenBar(); render();
</script>
